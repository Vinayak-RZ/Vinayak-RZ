name: Update activity stats

# Generates static PNGs into assets/ so the README never depends on
# flaky live widget hosts (Heroku / paused Vercel deployments).

on:
  schedule:
    - cron: "17 3 * * *" # daily ~03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-stats.mjs"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-activity-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install resvg
        run: npm install --no-save @resvg/resvg-js

      - name: Generate streak SVG (action, no live host)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: assets/streak.svg
          options: user=Vinayak-RZ&hide_border=true&background=0A0A0A&border=27272A&ring=E11D48&fire=E11D48&currStreakNum=FAFAFA&sideNums=FAFAFA&currStreakLabel=E11D48&sideLabels=A3A3A3&dates=A3A3A3&disable_animations=true

      - name: Generate stats SVG (GraphQL, no live host)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Vinayak-RZ
        run: node scripts/generate-stats.mjs

      - name: Rasterize panels to PNG
        run: |
          node <<'EOF'
          const { Resvg } = require('@resvg/resvg-js');
          const fs = require('fs');
          const path = require('path');
          const dir = 'assets';
          const files = [
            ['activity-header.svg', 2400],
            ['streak.svg', 1200],
            ['stats.svg', 2400],
          ];
          for (const [name, width] of files) {
            const svgPath = path.join(dir, name);
            if (!fs.existsSync(svgPath)) {
              console.error('missing', svgPath);
              process.exit(1);
            }
            const svg = fs.readFileSync(svgPath);
            const resvg = new Resvg(svg, { fitTo: { mode: 'width', value: width } });
            const pngName = name.replace(/\.svg$/, '.png');
            fs.writeFileSync(path.join(dir, pngName), resvg.render().asPng());
            console.log('wrote', pngName);
          }
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg assets/streak.png assets/stats.svg assets/stats.png assets/activity-header.png
          if git diff --cached --quiet; then
            echo "No stats changes."
            exit 0
          fi
          git commit -m "chore(profile): refresh activity stats"
          git push
